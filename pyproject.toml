[build-system]
requires = ["setuptools", "ziglang>=0.14.0,<0.15", "numpy>=1.26.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "awpy>=2.0.2",
    "gymnasium>=0.29.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "nvidia-ml-py>=13.590.48",
    "onnx>=1.21.0",
    "onnxruntime>=1.24.4",
    "pettingzoo>=1.24.0",
                                                       # EXACT pin (gh #85): upstream 4.0 deletes pufferlib.vector/pytorch which
                                                       # our monkey-patches import; a loose specifier would let a future relock
                                                       # resolve to 4.0 and break loudly at a random moment. Upgrade is a
                                                       # deliberate migration (see #85 playbook), not a version bump.
    "pufferlib==3.0.0",
    "rerun-sdk>=0.21.0",
    "shapely>=2.0.4",
]

[dependency-groups]
dev = [
    "ruff>=0.11.13",
    "pytest>=9.0.2",
    "yapf>=0.43.0",
    # clang-format is the PyPI wheel that ships the `clang-format` binary —
    # used by .githooks/pre-commit via `uv run --no-sync clang-format`. Keeping it here
    # means a fresh `uv sync` sets up the full hook toolchain in one step
    # (no apt / brew / separate tool installs needed).
    "clang-format>=20.1.0",
    "pytest-timeout>=2.4.0",
    # Pinned EXACTLY, not ">=". The type gate (scripts/pyrefly_gate.py) freezes
    # the repo's pre-existing errors in pyrefly-snapshot.json under a key made of
    # exact message strings; a minor-version bump rewrites concise_description
    # wholesale and turns the next commit into an unreadable wall of diffs.
    "pyrefly==1.2.0",
    # Enforces the package's layering: the contracts are [tool.importlinter] below,
    # and tests/test_import_layers.py runs them on every suite run. Dev-only (no
    # runtime import), so the Modal image, built from the runtime graph alone, does
    # not change. The CLI is the `lint-imports` console script; 2.15 ships no
    # `python -m importlinter`. The floor is the version the contracts were measured
    # on (`broken_contract_guidance` and `--no-logo` need 2.14).
    "import-linter>=2.15,<3",
]
# NON-DEFAULT group (RL-overhaul task 14, tracker #82): the Modal SDK is needed
# only for the optional cloud training runner (scripts/run_modal.py). A plain
# `uv sync` must not pull it — the local/scientific stack stays byte-identical
# either way — so it lives outside `dev` and is only installed via
# `uv sync --group modal`. The floor pins the SDK contract the runner relies on
# (Function.with_options cpu/memory tuples, Dict.put skip_if_exists,
# objects.create allow_existing); the <2 ceiling avoids tracking a future major.
modal = [
    "modal>=1.4.3,<2",
]

[tool.setuptools.packages.find]
# One package, cs2rl, under src/. Explicit because automatic src-layout discovery
# also scans PEP 420 namespace directories (src/cs2rl/c_env/demo_assets, zig-out,
# zig-pkg); namespaces = false keeps the wheel to the real packages (cs2rl and its
# subpackages c_env, deploy and experiment).
where = ["src"]
include = ["cs2rl*"]
namespaces = false

[tool.uv]
# Keep numpy>=2 available for the current awpy stack in this repo.
override-dependencies = [
    "numpy>=2.0.0",
]
# nvidia-ml-py supplies the pynvml import. This excluded distribution only
# adds deprecated utilities and an import warning hook (via PufferLib).
exclude-dependencies = ["pynvml"]

# pytest 9's native table; it cannot coexist with [tool.pytest.ini_options].
#
# --import-mode=importlib is pytest's recommended mode. pytest itself no longer inserts
# test directories into sys.path, so a module has one name: a test file is imported as
# `tests.test_x`, derived from the rootdir. The flag has no ini key, hence addopts.
#
# "." (resolved against this file's directory, the repo root) is the one sys.path entry
# the suite needs. It makes `scripts.*` and `tests.*` importable in this process from any
# test file run alone. Neither directory has an __init__.py, so both are namespace
# packages; tests/conftest.py stops a session that could merge another tree's `tests/`
# or `scripts/` into them (#207).
#
# pytest's docs recommend putting test utilities with the library code instead. They
# stay under tests/ because cs2rl ships in the wheel and the Modal image, and test code
# must not.
#
# The config is in-process only: pytest applies `pythonpath` to its own sys.path, and a
# child interpreter never inherits that, so code that launches one keeps setting
# PYTHONPATH and the cwd itself (tests/conftest.py:29-32).
[tool.pytest]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# scripts/ has no __init__.py, so ruff otherwise resolves the relative imports
# inside scripts/modal_runner to a top-level `modal_runner`.
namespace-packages = ["scripts"]

[tool.ruff.lint]
# TID251 enforces the banned-api table below: one import spelling per module.
select = ["E", "F", "I", "UP", "B", "TID251"]
# E501 (line-too-long) disabled: YAPF's `spaces_before_comment` aligner pushes
# trailing comments past column 100 when the preceding code is long, producing
# fights between the formatter and the linter. YAPF's column_limit=100 still
# keeps lines reasonable for actual code; we just stop policing trailing comments.
ignore = ["E501"]

# One spelling per module. A module imported under two names is two module
# objects with two copies of its state, so a monkeypatch or an `except` aimed at
# one misses the other. Each entry bans the spelling that is NOT canonical; the
# runtime half is the session guard in tests/conftest.py.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src".msg = "import `cs2rl.X`, not `src.cs2rl.X`"
# #204 moved the deploy libraries into the package; deploy/ keeps only the plugin, its
# docs and the verify_onnx.py script. This one entry also bans every `deploy.<module>`.
"deploy".msg = "import `cs2rl.deploy.X` (#204 moved the deploy libraries into the package)"
# #204 moved the experiment and BC-demo libraries out of scripts/ into the package, so
# scripts/ holds only CLIs. Each old spelling, bare (a sys.path insert of scripts/ or
# deploy/) and dotted, names the one it became.
"exp_lib".msg = "import `cs2rl.experiment.lib` (e.g. `from cs2rl.experiment import lib as exp_lib`)"
"scripts.exp_lib".msg = "import `cs2rl.experiment.lib` (e.g. `from cs2rl.experiment import lib as exp_lib`)"
"analyze_tplant".msg = "import `cs2rl.experiment.analyze_tplant`"
"scripts.analyze_tplant".msg = "import `cs2rl.experiment.analyze_tplant`"
"rung1_gate".msg = "import `cs2rl.experiment.gate`"
"scripts.rung1_gate".msg = "import `cs2rl.experiment.gate`"
"rung1a_smoke_read".msg = "import `cs2rl.experiment.smoke_read`"
"scripts.rung1a_smoke_read".msg = "import `cs2rl.experiment.smoke_read`"
"oracle_statue_check".msg = "import `cs2rl.experiment.oracle_statue`"
"scripts.oracle_statue_check".msg = "import `cs2rl.experiment.oracle_statue`"
"gen_bc_demos".msg = "import `cs2rl.bc_demos`"
"scripts.gen_bc_demos".msg = "import `cs2rl.bc_demos`"
"export_policy".msg = "import `cs2rl.deploy.export_policy`"
"export_mapdata".msg = "import `cs2rl.deploy.export_mapdata`"
# The experiment CLIs that stay in scripts/ hold nothing another module may import
# (#204): a test that needs a constant reads it with runpy.run_path, which also keeps
# the file out of sys.modules under a second name. Bare (a sys.path insert of
# scripts/) and dotted spellings are both banned.
"scripts.run_experiment".msg = "a CLI, not a library: read its constants with runpy.run_path"
"scripts.analyze_experiment".msg = "a CLI, not a library: import what it uses from cs2rl.experiment"
"scripts.reconcile_experiments".msg = "a CLI, not a library: import what it uses from cs2rl.experiment"
"scripts.promote_baseline".msg = "a CLI, not a library: import what it uses from cs2rl.experiment"
"run_experiment".msg = "a CLI, not a library: read its constants with runpy.run_path"
"analyze_experiment".msg = "a CLI, not a library: import what it uses from cs2rl.experiment"
"reconcile_experiments".msg = "a CLI, not a library: import what it uses from cs2rl.experiment"
"promote_baseline".msg = "a CLI, not a library: import what it uses from cs2rl.experiment"
# The Modal runner STAYS under scripts/: the owner's carve-out, recorded here as that
# comment asked ("the Modal runner must stay under `scripts/`",
# https://github.com/utof/cs2rl/issues/204#issuecomment-5654424835). It is baked into the
# runner image AND shipped inside the source archive the container extracts, so a copy
# under src/ would make the archived one importable. Part 2 (#274) re-measures that.
"modal_runner".msg = "import `scripts.modal_runner`"
"run_modal".msg = "import `scripts.run_modal`"
"modal_artifacts".msg = "import `scripts.modal_artifacts`"
"modal_backfill_sidecar".msg = "import `scripts.modal_backfill_sidecar`"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.yapf]
based_on_style          = "pep8"
column_limit            = 100
# Snap trailing comments to the first column stop > longest line in the block.
# Tune these stops to match typical line lengths in the codebase.
spaces_before_comment   = "40, 56, 72"
indent_width            = 4

# The package's layering (#205), checked by tests/test_import_layers.py on every suite
# run; by hand: `lint-imports --no-cache --no-logo` from the repo root with
# PYTHONPATH=<checkout>/src. Without that PYTHONPATH a worktree checks MAIN's tree and
# passes: import-linter finds cs2rl with find_spec, which never runs the package's
# foreign-checkout guard.
#
# import-linter counts function-local imports as edges, and an ignore_imports entry names
# a module PAIR, never a line or a scope: it hides every site of that pair, a future
# module-scope one included. tests/test_import_layers.py therefore pins every ignored
# pair's sites inside a def (the scope pin), and fails if a module is invisible to the
# graph (a directory without __init__.py).
[tool.importlinter]
root_package = "cs2rl"

# Higher layers may import lower ones, never the reverse. exhaustive: every module
# directly under cs2rl must be named here, so a new module fails until it gets a layer.
# `|` members may not import each other; `:` members may, so this contract does not
# reject a cycle among them. The acyclic contract below does.
[[tool.importlinter.contracts]]
name = "cs2rl layers"
type = "layers"
containers = ["cs2rl"]
exhaustive = true
layers = [
    "experiment | deploy",
    # metrics_schema sits here with eval (#184 §4's eval/), so train -> metrics_schema is
    # an upward edge; tests/test_w1_modules.py's NOT_IMPORTED_BY_TRAIN relies on that.
    "train_bc : bc_demos : scripted_expert : play : play_actions : eval_baselines : profile_step : viz : metrics_schema",
    "train : trainer : train_shared : train_config : train_metrics : train_update : resume_state : train_helpers_batch1 : train_test_harness",
    "nav : map : c_env : env_factory",
    "_action_spec : _obs_spec : paths : env_config",
]
ignore_imports = [
    # env_factory.py:416, in build_selfplay_manager: SelfPlayManager lives in train.py.
    # Function-local because train.py imports env_factory at module scope (a module-scope
    # import back would cycle) and runs as `__main__` (env_factory's docstring). #92
    # removes it.
    "cs2rl.env_factory -> cs2rl.train",
    # train.py:3047, in train(), only under --eval-interval: eval_baselines imports torch
    # at module scope and `from cs2rl import train` must stay torch-free. #92 removes it.
    "cs2rl.train -> cs2rl.eval_baselines",
    # train.py:903 and :916, in record_episode (--record): viz imports rerun at module
    # scope. #92 removes it.
    "cs2rl.train -> cs2rl.viz",
]
broken_contract_guidance = "Give a new module a layer in pyproject.toml. Move an upward import down, or into the function that needs it. Never widen ignore_imports: #92 retires its entries."

# No cycles among the children of cs2rl, or of any package inside it, at any scope
# (import-linter sees function-local imports too). One cycle exists today, through
# {env_factory, eval_baselines, train, trainer}; each ignored pair below is a
# function-local edge of it, and ignoring the three is what breaks it.
[[tool.importlinter.contracts]]
name = "cs2rl acyclic siblings"
type = "acyclic_siblings"
ancestors = ["cs2rl"]
ignore_imports = [
    # env_factory.py:416, as in the layers contract above. #92 removes it.
    "cs2rl.env_factory -> cs2rl.train",
    # train.py:3047, as in the layers contract above. #92 removes it.
    "cs2rl.train -> cs2rl.eval_baselines",
    # train.py:2951, in train(): trainer subclasses PuffeRL, so it imports torch at module
    # scope, and `from cs2rl import train` must stay torch-free (train.py:2948-2950). Not
    # #92's: it stays while trainer.py imports train at module scope.
    "cs2rl.train -> cs2rl.trainer",
]
broken_contract_guidance = "Break the cycle: move one of its imports into the function that needs it, or move the shared code down a layer. Never widen ignore_imports: #92 retires its entries."
