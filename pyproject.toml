"cs2rl.viz.init_recording".msg = "import it from `cs2rl.viz.render` (#205 moved viz.py)"
"cs2rl.viz.log_trimap".msg = "import it from `cs2rl.viz.render` (#205 moved viz.py)"
"cs2rl.viz.log_navmesh".msg = "import it from `cs2rl.viz.render` (#205 moved viz.py)"
