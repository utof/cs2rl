[build-system]
requires = ["setuptools", "ziglang>=0.14.0,<0.15", "numpy>=1.26.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2rl"
version = "0.1.0"
description = "cs2rl trains Counter-Strike 2 bots with reinforcement learning, in a simulation rather than the game."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "awpy>=2.0.2",
    "gymnasium>=0.29.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "nvidia-ml-py>=13.590.48",
    "onnx>=1.21.0",
    "onnxruntime>=1.24.4",
    "pettingzoo>=1.24.0",
                                                       # EXACT pin (gh #85): upstream 4.0 deletes pufferlib.vector/pytorch which
                                                       # our monkey-patches import; a loose specifier would let a future relock
                                                       # resolve to 4.0 and break loudly at a random moment. Upgrade is a
                                                       # deliberate migration (see #85 playbook), not a version bump.
    "pufferlib==3.0.0",
    "rerun-sdk>=0.21.0",
    "shapely>=2.0.4",
]

[dependency-groups]
dev = [
    "ruff>=0.11.13",
    "pytest>=9.0.2",
    "yapf>=0.43.0",
    # clang-format is the PyPI wheel that ships the `clang-format` binary —
    # used by .githooks/pre-commit via `uv run --no-sync clang-format`. Keeping it here
    # means a fresh `uv sync` sets up the full hook toolchain in one step
    # (no apt / brew / separate tool installs needed).
    "clang-format>=20.1.0",
    "pytest-timeout>=2.4.0",
    # Pinned EXACTLY, not ">=". The type gate (scripts/pyrefly_gate.py) freezes
    # the repo's pre-existing errors in pyrefly-snapshot.json under a key made of
    # exact message strings; a minor-version bump rewrites concise_description
    # wholesale and turns the next commit into an unreadable wall of diffs.
    "pyrefly==1.2.0",
    # Enforces the package's layering: the contracts are [tool.importlinter] below,
    # and tests/integration/test_import_layers.py runs them on every suite run. Dev-only (no
    # runtime import), so the Modal image, built from the runtime graph alone, does
    # not change. The CLI is the `lint-imports` console script; 2.15 ships no
    # `python -m importlinter`. The floor is the version the contracts were measured
    # on (`broken_contract_guidance` and `--no-logo` need 2.14).
    "import-linter>=2.15,<3",
    # Same range as [build-system].requires. The build gets zig from its isolated
    # build env; the test suite needs its own: tests/env/c/test_fast_math_variant.py (#136)
    # resolves zig through setup.py's `python -m ziglang` route, and without the
    # wheel in .venv that test skipped in every session (#288).
    "ziglang>=0.14.0,<0.15",
    "pytest-xdist>=3.8.0",
]
# NON-DEFAULT group (RL-overhaul task 14, tracker #82): the Modal SDK is needed
# only for the optional cloud training runner (scripts/run_modal.py). A plain
# `uv sync` must not pull it — the local/scientific stack stays byte-identical
# either way — so it lives outside `dev` and is only installed via
# `uv sync --group modal`. The floor pins the SDK contract the runner relies on
# (Function.with_options cpu/memory tuples, Dict.put skip_if_exists,
# objects.create allow_existing); the <2 ceiling avoids tracking a future major.
modal = [
    "modal>=1.4.3,<2",
]

[tool.setuptools.packages.find]
# One package, cs2rl, under src/. Explicit because automatic src-layout discovery
# also scans PEP 420 namespace directories (src/cs2rl/env/c/demo_assets, zig-out,
# zig-pkg); namespaces = false keeps the wheel to the real packages (cs2rl and its
# subpackages deploy, env, env.c, eval, experiment, spec, train and viz). The flip
# side: a new subpackage without an __init__.py is dropped from the wheel silently.
# grimp skips it too, so tests/integration/test_import_layers.py's coverage check is what fails on
# one.
where = ["src"]
include = ["cs2rl*"]
namespaces = false

[tool.uv]
# Keep numpy>=2 available for the current awpy stack in this repo.
override-dependencies = [
    "numpy>=2.0.0",
]
# nvidia-ml-py supplies the pynvml import. This excluded distribution only
# adds deprecated utilities and an import warning hook (via PufferLib).
exclude-dependencies = ["pynvml"]

# pytest 9's native table; it cannot coexist with [tool.pytest.ini_options].
#
# --import-mode=importlib is the mode pytest recommends for new projects. pytest itself
# no longer inserts test directories into sys.path, so a module has one name: a test file
# is imported as `tests.test_x`, derived from the rootdir. The flag has no ini key, hence
# addopts.
#
# "." (resolved against this file's directory, the repo root) is the one sys.path entry
# the suite needs. It makes `scripts.*` and `tests.*` importable in this process from any
# test file run alone. Neither directory has an __init__.py, so both are namespace
# packages; tests/conftest.py stops a session that could merge another tree's `tests/`
# or `scripts/` into them (#207).
#
# pytest's docs recommend putting test utilities with the library code instead. They
# stay under tests/ (tests/_helpers/) because cs2rl ships in the wheel (the
# [tool.setuptools.packages.find] table above takes `cs2rl*` from src/), and test code
# must not.
#
# The config is in-process only: pytest applies `pythonpath` to its own sys.path, and a
# child interpreter never inherits that, so code that launches one keeps setting
# PYTHONPATH and the cwd itself (tests/conftest.py:29-32).
[tool.pytest]
# -rfEs adds every skip and its reason to the short summary (#288: a skip was one `s`
# among the dots, and hid the fast-math guard for a whole refactor wave).
# PITFALL: -r chars REPLACE pytest's default `fE`, they do not add to it. `-rs` alone
# drops every FAILED/ERROR line from the summary, so keep the f and the E.
addopts = ["--import-mode=importlib", "-rfEs"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# scripts/ has no __init__.py, so ruff otherwise resolves the relative imports
# inside scripts/modal_runner to a top-level `modal_runner`.
namespace-packages = ["scripts"]

[tool.ruff.lint]
# TID251 enforces the banned-api table below: one import spelling per module.
select = ["E", "F", "I", "UP", "B", "TID251"]
# E501 (line-too-long) disabled: YAPF's `spaces_before_comment` aligner pushes
# trailing comments past column 100 when the preceding code is long, producing
# fights between the formatter and the linter. YAPF's column_limit=100 still
# keeps lines reasonable for actual code; we just stop policing trailing comments.
ignore = ["E501"]

# One spelling per module. A module imported under two names is two module
# objects with two copies of its state, so a monkeypatch or an `except` aimed at
# one misses the other. Each entry bans the spelling that is NOT canonical; the
# runtime half is the session guard in tests/conftest.py.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src".msg = "import `cs2rl.X`, not `src.cs2rl.X`"
# #204 moved the deploy libraries into the package; deploy/ keeps only the plugin, its
# docs and the verify_onnx.py script. This one entry also bans every `deploy.<module>`.
"deploy".msg = "import `cs2rl.deploy.X` (#204 moved the deploy libraries into the package)"
# #204 moved the experiment and BC-demo libraries out of scripts/ into the package, so
# scripts/ holds only CLIs. Each old spelling, bare (a sys.path insert of scripts/ or
# deploy/) and dotted, names the one it became.
"analyze_tplant".msg = "import `cs2rl.experiment.analyze_tplant`"
"scripts.analyze_tplant".msg = "import `cs2rl.experiment.analyze_tplant`"
"rung1_gate".msg = "import `cs2rl.experiment.gate`"
"scripts.rung1_gate".msg = "import `cs2rl.experiment.gate`"
"rung1a_smoke_read".msg = "import `cs2rl.experiment.smoke_read`"
"scripts.rung1a_smoke_read".msg = "import `cs2rl.experiment.smoke_read`"
"oracle_statue_check".msg = "import `cs2rl.experiment.oracle_statue`"
"scripts.oracle_statue_check".msg = "import `cs2rl.experiment.oracle_statue`"
"gen_bc_demos".msg = "import `cs2rl.bc_demos`"
"scripts.gen_bc_demos".msg = "import `cs2rl.bc_demos`"
"export_policy".msg = "import `cs2rl.deploy.export_policy`"
"export_mapdata".msg = "import `cs2rl.deploy.export_mapdata`"
# The Modal runner STAYS under scripts/: the owner's carve-out, recorded here as that
# comment asked ("the Modal runner must stay under `scripts/`",
# https://github.com/utof/cs2rl/issues/204#issuecomment-5654424835). It is baked into the
# runner image AND shipped inside the source archive the container extracts. Training
# uses the installed cs2rl wheel and excludes inherited PYTHONPATH from its child env;
# archived scripts remain importable through the extracted source-root cwd (#274).
"modal_runner".msg = "import `scripts.modal_runner`"
"run_modal".msg = "import `scripts.run_modal`"
"modal_artifacts".msg = "import `scripts.modal_artifacts`"
"modal_backfill_sidecar".msg = "import `scripts.modal_backfill_sidecar`"
# #207 moved the metrics census, a test helper, into tests/_helpers/. The bare spelling
# (a sys.path insert of tests/) and the old dotted one are both banned.
"metrics_census".msg = "import `tests._helpers.metrics_census` (#207 moved it)"
"tests.metrics_census".msg = "import `tests._helpers.metrics_census` (#207 moved it)"
# #205 part 2a moved nine flat modules into the layer packages spec/, env/ and eval/.
# Each old dotted name, in any spelling (`from cs2rl import nav` included), names its new
# home. Needed because nothing else catches a leftover in a worktree before it runs: the
# pyrefly gate resolves cs2rl through the editable install, which names MAIN's src/.
"cs2rl._action_spec".msg = "import `cs2rl.spec.action` (#205 moved it)"
"cs2rl._obs_spec".msg = "import `cs2rl.spec.obs` (#205 moved it)"
"cs2rl.paths".msg = "import `cs2rl.spec.paths` (#205 moved it)"
"cs2rl.env_config".msg = "import `cs2rl.env.config`, e.g. `from cs2rl.env import config as env_config` (#205 moved it)"
"cs2rl.nav".msg = "import `cs2rl.env.nav` (#205 moved it)"
"cs2rl.map".msg = "import `cs2rl.env.map` (#205 moved it)"
"cs2rl.eval_baselines".msg = "import `cs2rl.eval.baselines` (#205 moved it)"
"cs2rl.metrics_schema".msg = "import `cs2rl.eval.metrics_schema` (#205 moved it)"
"cs2rl.scripted_expert".msg = "import `cs2rl.eval.scripted_expert` (#205 moved it)"
# #205 part 2b moved env_factory and c_env into env/, and play and play_actions into viz/.
# `cs2rl.viz` itself cannot be banned: it is the new package, and a ban covers its
# submodules. The old viz.py's members are banned by name instead, so a stale
# `from cs2rl.viz import log_tick` (which now imports the PACKAGE, and fails only when the
# line runs) is caught before it runs.
"cs2rl.env_factory".msg = "import `cs2rl.env.factory`, e.g. `from cs2rl.env import factory as env_factory` (#205 moved it)"
"cs2rl.c_env".msg = "import `cs2rl.env.c` (#205 moved it)"
"cs2rl.play".msg = "import `cs2rl.viz.play` (#205 moved it)"
