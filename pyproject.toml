[build-system]
requires = ["setuptools", "ziglang>=0.14.0,<0.15", "numpy>=1.26.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "awpy>=2.0.2",
    "gymnasium>=0.29.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "nvidia-ml-py>=13.590.48",
    "onnx>=1.21.0",
    "onnxruntime>=1.24.4",
    "pettingzoo>=1.24.0",
                                                       # EXACT pin (gh #85): upstream 4.0 deletes pufferlib.vector/pytorch which
                                                       # our monkey-patches import; a loose specifier would let a future relock
                                                       # resolve to 4.0 and break loudly at a random moment. Upgrade is a
                                                       # deliberate migration (see #85 playbook), not a version bump.
    "pufferlib==3.0.0",
    "pynvml>=13.0.1",
    "rerun-sdk>=0.21.0",
    "shapely>=2.0.4",
]

[dependency-groups]
dev = [
    "ruff>=0.11.13",
    "pytest>=9.0.2",
    "yapf>=0.43.0",
    # clang-format is the PyPI wheel that ships the `clang-format` binary —
    # used by .githooks/pre-commit via `uv run clang-format`. Keeping it here
    # means a fresh `uv sync` sets up the full hook toolchain in one step
    # (no apt / brew / separate tool installs needed).
    "clang-format>=20.1.0",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
# Keep numpy>=2 available for the current awpy stack in this repo.
override-dependencies = [
    "numpy>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (line-too-long) disabled: YAPF's `spaces_before_comment` aligner pushes
# trailing comments past column 100 when the preceding code is long, producing
# fights between the formatter and the linter. YAPF's column_limit=100 still
# keeps lines reasonable for actual code; we just stop policing trailing comments.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.yapf]
based_on_style          = "pep8"
column_limit            = 100
# Snap trailing comments to the first column stop > longest line in the block.
# Tune these stops to match typical line lengths in the codebase.
spaces_before_comment   = "40, 56, 72"
indent_width            = 4
