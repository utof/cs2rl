[project]
name = "cs2rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "awpy>=2.0.2",
    "gymnasium>=0.29.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "pettingzoo>=1.24.0",
    "pwd-stub; sys_platform == 'win32'",
    "rerun-sdk>=0.21.0",
    "sample-factory[pettingzoo-envs]",
    "shapely>=2.0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv]
# sample-factory 2.1.1 metadata says numpy<2.0 but works fine with numpy 2.x;
# override the numpy upper bound so it is compatible with awpy>=2.0.2
override-dependencies = [
    "numpy>=2.0.0",
]

[tool.uv.sources]
# PyPI 2.1.1 omits pettingzoo_envs.py; use git source at 2.1.3 commit until a fixed PyPI release.
# To update: check PyPI for sample-factory with pettingzoo-envs extra, then remove this git source.
sample-factory = { git = "https://github.com/alex-petrenko/sample-factory.git", rev = "8b354943a8b04e2fbb7c7c8f35ea3fed195dd631" }
pwd-stub = { workspace = true }

[tool.uv.workspace]
members = [
    "pwd_stub",
]
