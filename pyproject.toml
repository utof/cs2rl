[project]
name = "cs2rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "awpy>=2.0.2",
    "gymnasium>=0.29.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "nvidia-ml-py>=13.590.48",
    "pettingzoo>=1.24.0",
    "pufferlib>=3.0.0",
    "pynvml>=13.0.1",
    "rerun-sdk>=0.21.0",
    "shapely>=2.0.4",
]

[dependency-groups]
dev = [
    "ruff>=0.11.13",
    "pytest>=9.0.2",
    "cmake>=4.2.3",
]

[tool.uv]
# Keep numpy>=2 available for the current awpy stack in this repo.
override-dependencies = [
    "numpy>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
